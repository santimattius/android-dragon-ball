name: PR Validation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Require a closing issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const reference = body.match(
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i,
            );
            if (!reference) {
              core.setFailed(
                "PR body must contain Closes #N, Fixes #N, or Resolves #N.",
              );
            }

  approved-issue:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    steps:
      - name: Require an approved linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const reference = body.match(
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i,
            );
            if (!reference) {
              core.setFailed(
                "Cannot validate approval without a linked issue.",
              );
              return;
            }

            const issueNumber = Number(reference[1]);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const labels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );
            if (!labels.includes("status:approved")) {
              core.setFailed(`Issue #${issueNumber} is not status:approved.`);
            }

  type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one type label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels
              .map((label) => label.name)
              .filter((name) => name.startsWith("type:"));
            if (labels.length !== 1) {
              core.setFailed(
                `Expected exactly one type:* label, found ${labels.length}.`,
              );
            }
